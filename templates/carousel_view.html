<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Frame Selection - Cinema Timeline</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=SF+Mono&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Film Grain Overlay */
        .cinema-film-grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Background Ambient Glow */
        .cinema-ambient-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
            transition: opacity 1s ease;
        }

        .cinema-ambient-glow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.3) 0%, transparent 70%);
            filter: blur(150px);
            mix-blend-mode: screen;
        }

        /* Header HUD */
        .cinema-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 50;
            pointer-events: none;
            user-select: none;
        }

        .cinema-header>* {
            pointer-events: auto;
        }

        .cinema-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cinema-title h1 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: white;
        }

        .cinema-status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', monospace;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .cinema-status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }

        .cinema-header-controls {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .cinema-settings-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .cinema-settings-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .cinema-export-btn {
            padding: 12px 24px;
            border-radius: 9999px;
            background: white;
            color: black;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .cinema-export-btn:hover {
            transform: scale(1.05);
        }

        /* --- NLE Layout Styles --- */

        /* Main Player Stage */
        .nle-main-player {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: min(80vw, 1200px);
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 10;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nle-main-player img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 1;
            transition: opacity 0.1s ease;
        }

        .frame-position-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            letter-spacing: 0.05em;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        /* Timeline Strip Container */
        .nle-timeline-strip {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 320px;
            /* Increased height for controls */
            background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.9) 60%, transparent 100%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 40px;
            align-items: center;
        }

        /* Scrub Bar & Timecode */
        .nle-scrub-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            width: 100%;
            pointer-events: none;
        }

        .nle-timecode {
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.2em;
            font-variant-numeric: tabular-nums;
        }

        .nle-progress-track {
            width: 384px;
            /* w-96 */
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .nle-progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            background: white;
            width: 100%;
            transform-origin: left;
            transform: scaleX(0);
            /* Updated by JS */
        }

        /* Glass Controls Toolbar */
        .nle-glass-toolbar {
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.03);
            /* Very subtle bg */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            transform: scale(0.9);
            transition: background 0.3s ease;
            margin-bottom: 10px;
        }

        .nle-glass-toolbar:hover {
            background: rgba(10, 10, 10, 0.9);
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            position: relative;
            transition: color 0.2s ease;
        }

        .tool-btn:hover {
            color: white;
        }

        .tool-icon-box {
            padding: 8px;
            border-radius: 12px;
            transition: background 0.2s ease;
        }

        .tool-btn:hover .tool-icon-box {
            background: rgba(255, 255, 255, 0.1);
        }

        .tool-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
            position: absolute;
            bottom: -24px;
            opacity: 0;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        .tool-btn:hover .tool-label {
            opacity: 1;
        }

        .tool-separator {
            width: 1px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 8px;
        }

        .play-btn-large {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: white;
            color: black;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            margin: 0 8px;
        }

        .play-btn-large:hover {
            transform: scale(1.05);
        }

        .play-btn-large:active {
            transform: scale(0.95);
        }

        /* Cinema Timeline Viewport */
        .cinema-timeline-viewport {
            position: absolute;
            /* Positioned relative to strip */
            bottom: 140px;
            /* Above controls */
            left: 0;
            right: 0;
            height: 160px;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            /* Removed scroll-snap-type to prevent conflict with JS scrollTo */
            /* Removed scroll-behavior as JS handles smooth scrolling */
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: grab;
            perspective: 1500px;
            /* Deep perspective */
            z-index: 10;
        }

        .cinema-timeline-viewport:active {
            cursor: grabbing;
        }

        .cinema-timeline-viewport::-webkit-scrollbar {
            display: none;
        }

        .cinema-timeline-inner {
            display: flex;
            gap: 60px;
            /* Matches GAP in LiquidTimeline */
            align-items: center;
            transform-style: preserve-3d;
            /* Padding set dynamically by JS */
        }

        /* Cinema Frame Cards */
        .cinema-frame-card {
            flex-shrink: 0;
            width: 240px;
            /* Compact width for NLE */
            aspect-ratio: 16 / 9;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            /* Removed scroll-snap-align as JS handles centering */
            background: #111827;
            /* gray-900 */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            /* shadow-2xl */
            will-change: transform, opacity, filter;
            /* No CSS transition for transform/opacity/filter as we use JS for physics */
        }

        /* Glass Reflection Layer */
        .card-reflection {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent, rgba(0, 0, 0, 0.4));
            z-index: 20;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .cinema-frame-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            pointer-events: none;
        }

        /* Metadata Overlay */
        .card-metadata {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.5), transparent);
            z-index: 30;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cinema-frame-card:hover .card-metadata {
            opacity: 1;
        }

        .card-metadata p {
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', monospace;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        /* Active Border Glow */
        .card-border-glow {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            z-index: 40;
            opacity: 0;
            /* Controlled by JS */
            pointer-events: none;
        }

        /* Center Focus Indicator */
        .center-focus-line {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1px;
            height: 80vh;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.1), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* Delete button danger state */
        #delete-frame-btn:hover {
            color: #ef4444;
        }

        #delete-frame-btn:hover .tool-icon-box {
            background: rgba(239, 68, 68, 0.15);
        }

        /* Insert button highlight */
        #insert-frame-btn:hover {
            color: #10b981;
        }

        #insert-frame-btn:hover .tool-icon-box {
            background: rgba(16, 185, 129, 0.15);
        }

        /* Download buttons highlight */
        #download-frame-btn:hover,
        #download-all-btn:hover {
            color: #3b82f6;
        }

        #download-frame-btn:hover .tool-icon-box,
        #download-all-btn:hover .tool-icon-box {
            background: rgba(59, 130, 246, 0.15);
        }

        /* Edit button highlight */
        #edit-frames-btn:hover {
            color: #a78bfa;
        }

        #edit-frames-btn:hover .tool-icon-box {
            background: rgba(167, 139, 250, 0.15);
        }

        /* Modal/Popup Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.98) 0%, rgba(31, 41, 55, 0.98) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .modal-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            font-size: 16px;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='white' stroke-opacity='0.6' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 16px center;
            padding-right: 40px;
        }

        .form-select:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .form-select:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
        }

        .form-textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            font-size: 16px;
            font-family: 'Space Grotesk', sans-serif;
            resize: vertical;
            min-height: 120px;
            transition: all 0.2s ease;
        }

        .form-textarea:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .form-textarea:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
        }

        .form-textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 32px;
        }

        .btn-secondary {
            padding: 12px 24px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-primary {
            padding: 12px 32px;
            border-radius: 12px;
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(167, 139, 250, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .model-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 8px;
            font-size: 12px;
            color: #a78bfa;
            font-weight: 500;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Film Grain Overlay -->
    <div class="cinema-film-grain"></div>

    <!-- Background Ambient Glow -->
    <div class="cinema-ambient-glow"></div>

    <!-- Center Focus Indicator -->
    <div class="center-focus-line"></div>

    <!-- Header HUD -->
    <div class="cinema-header">
        <div class="cinema-title">
            <h1>Sequence 01</h1>
            <div class="cinema-status-bar">
                <div class="cinema-status-indicator"></div>
                <span>Ready</span>
                <span style="margin: 0 8px;">|</span>
                <span>4K HDR</span>
            </div>
        </div>

        <div class="cinema-header-controls">
            <button class="cinema-settings-btn" title="Settings">
                <span class="material-symbols-outlined" style="font-size: 20px;">settings</span>
            </button>
            <button class="cinema-export-btn" id="confirm-selection-btn">
                Export Video
            </button>
        </div>
    </div>

    <!-- Main Player -->
    <div class="nle-main-player">
        <div class="frame-position-badge" id="frame-position-badge">Frame #-- / 0</div>
        <img id="main-player-image" src="" alt="Active Frame">
    </div>

    <!-- Bottom Timeline Strip -->
    <div class="nle-timeline-strip">

        <!-- Timeline Viewport -->
        <div class="cinema-timeline-viewport" id="cinema-timeline-viewport">
            <div class="cinema-timeline-inner" id="cinema-timeline-inner">
                <!-- Cards injected here -->
            </div>
        </div>

        <!-- Scrub Bar / Timecode -->
        <div class="nle-scrub-section">
            <div class="nle-timecode" id="nle-timecode">00:00:00:00</div>
            <div class="nle-progress-track">
                <div class="nle-progress-fill" id="nle-progress-fill"></div>
            </div>
        </div>

        <!-- Glass Controls Toolbar -->
        <div class="nle-glass-toolbar">
            <button class="tool-btn" id="delete-frame-btn" title="Delete current frame">
                <div class="tool-icon-box">
                    <span class="material-symbols-outlined">delete</span>
                </div>
                <span class="tool-label">Delete</span>
            </button>
            <button class="tool-btn" id="insert-frame-btn" title="Insert new frame">
                <div class="tool-icon-box">
                    <span class="material-symbols-outlined">add_photo_alternate</span>
                </div>
                <span class="tool-label">Insert</span>
            </button>

            <div class="tool-separator"></div>

            <button class="play-btn-large" id="play-pause-btn">
                <span class="material-symbols-outlined" style="font-size: 28px;">play_arrow</span>
            </button>

            <div class="tool-separator"></div>

            <button class="tool-btn" id="download-frame-btn" title="Download current frame">
                <div class="tool-icon-box">
                    <span class="material-symbols-outlined">download</span>
                </div>
                <span class="tool-label">Download</span>
            </button>
            <button class="tool-btn" id="edit-frames-btn" title="Edit current frame with AI">
                <div class="tool-icon-box">
                    <span class="material-symbols-outlined">auto_fix_high</span>
                </div>
                <span class="tool-label">Edit Frame</span>
            </button>
        </div>
    </div>

    <!-- Hidden file input for frame insertion -->
    <input type="file" id="frame-file-input" accept="image/*" style="display: none;">

    <!-- Edit Frames Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>
                    <span class="material-symbols-outlined">auto_fix_high</span>
                    AI Frame Editor
                </h2>
                <button class="modal-close-btn" id="modal-close-btn">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="model-select">
                        Select AI Model
                        <span class="model-badge">
                            <span class="material-symbols-outlined" style="font-size: 14px;">psychology</span>
                            Powered by Nanobanana
                        </span>
                    </label>
                    <select class="form-select" id="model-select">
                        <option value="nanobanana-pro">Nanobanana Pro (Recommended)</option>
                        <option value="nanobanana-standard">Nanobanana Standard</option>
                        <option value="nanobanana-creative">Nanobanana Creative</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-prompt">
                        Edit Prompt
                        <span style="color: rgba(255, 255, 255, 0.5); font-size: 12px; text-transform: none; font-weight: 400;">
                            Describe how you want to edit the current frame
                        </span>
                    </label>
                    <textarea
                        class="form-textarea"
                        id="edit-prompt"
                        placeholder="Example: Enhance colors and brightness, add a cinematic look, remove background noise..."
                    ></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modal-cancel-btn">Cancel</button>
                <button class="btn-primary" id="modal-submit-btn">
                    <span id="submit-btn-text">Apply Edits</span>
                    <span id="submit-btn-spinner" style="display: none;" class="loading-spinner"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            frames: [],
            currentIndex: 0,
            isNavigating: false,
            targetIndex: 0,
            targetScroll: 0,
        };

        const CARD_WIDTH = 240;
        const GAP = 60;
        const STRIDE = CARD_WIDTH + GAP;

        // --- DOM Elements ---
        const viewport = document.getElementById('cinema-timeline-viewport');
        const inner = document.getElementById('cinema-timeline-inner');
        const timecodeEl = document.getElementById('nle-timecode');
        const progressFillEl = document.getElementById('nle-progress-fill');
        const mainPlayerImg = document.getElementById('main-player-image');
        const frameBadgeEl = document.getElementById('frame-position-badge');

        // --- Initialize ---
        function init() {
            // Data passed from server via Jinja2
            const serverFrames = {{ frames | default([]) | tojson | safe }};

            if (serverFrames && serverFrames.length > 0) {
                state.frames = serverFrames.map((f, i) => ({
                    id: f.frame_id,
                    src: f.url,
                    timestamp: f.timestamp,
                    frame_number: i + 1,
                    seconds: f.seconds,
                    path: f.path
                }));
            } else {
                console.warn("No frames provided from server");
                state.frames = [];
            }

            if (state.frames.length > 0) {
                renderTimeline();
                setActiveIndex(0, { force: true, instant: true });

                // Set inner padding to center first/last cards
                const viewportWidth = window.innerWidth;
                const sidePadding = (viewportWidth / 2) - (CARD_WIDTH / 2);
                inner.style.paddingLeft = `${sidePadding}px`;
                inner.style.paddingRight = `${sidePadding}px`;

                // Set initial scroll position to 0 to center the first frame
                viewport.scrollLeft = 0;

                // Initial Transform Update
                requestAnimationFrame(updateCardTransforms);
            } else {
                inner.innerHTML = '<div style="color: #666; text-align: center; padding: 100px;">No frames available</div>';
            }

            // Event Listeners
            viewport.addEventListener('scroll', handleScroll);
            document.addEventListener('keydown', handleKeyboard);
            document.getElementById('confirm-selection-btn').addEventListener('click', exportVideo);

            // New control buttons
            document.getElementById('delete-frame-btn').addEventListener('click', handleDeleteFrame);
            document.getElementById('insert-frame-btn').addEventListener('click', handleInsertFrame);
            document.getElementById('download-frame-btn').addEventListener('click', handleDownloadFrame);
            document.getElementById('edit-frames-btn').addEventListener('click', handleEditFramesOpen);
            document.getElementById('frame-file-input').addEventListener('change', handleFileSelected);

            // Modal event listeners
            document.getElementById('modal-close-btn').addEventListener('click', closeEditModal);
            document.getElementById('modal-cancel-btn').addEventListener('click', closeEditModal);
            document.getElementById('modal-submit-btn').addEventListener('click', handleEditFramesSubmit);
            document.getElementById('edit-modal').addEventListener('click', (e) => {
                if (e.target.id === 'edit-modal') closeEditModal();
            });
        }

        function renderTimeline() {
            inner.innerHTML = state.frames.map((frame, index) => `
                <div class="cinema-frame-card"
                     data-index="${index}"
                     onclick="scrollToIndex(${index})">
                    <div class="card-reflection"></div>
                    <img src="${frame.src}" alt="Frame ${frame.frame_number}" draggable="false">
                    <div class="card-metadata">
                        <p>
                            <span>Clip ${frame.frame_number}</span>
                            <span style="opacity: 0.5;">RAW</span>
                        </p>
                    </div>
                    <div class="card-border-glow"></div>
                </div>
            `).join('');
        }

        function updateCardTransforms() {
            const scrollX = viewport.scrollLeft;
            const viewportWidth = viewport.clientWidth;
            const centerX = scrollX + (viewportWidth / 2);

            // Check if keyboard navigation scroll has completed
            if (state.isNavigating) {
                // Use stored clamped scroll position for accurate completion check
                const targetScroll = state.targetScroll !== undefined ? state.targetScroll : state.targetIndex * STRIDE;
                const scrollDiff = Math.abs(scrollX - targetScroll);
                // Unlock when scroll is close enough to target (within 10px for smoother transition)
                if (scrollDiff < 10) {
                    state.isNavigating = false;
                }
            }

            const cards = inner.querySelectorAll('.cinema-frame-card');

            cards.forEach((card, index) => {
                const cardCenter = card.offsetLeft + (CARD_WIDTH / 2);
                const distance = cardCenter - centerX;
                const normalizedDistance = distance / STRIDE;

                // --- Physics Logic (Ported from LiquidTimeline.tsx) ---

                // Input Range logic simulation
                // We want effects to happen within +/- 2 strides

                const absDist = Math.abs(normalizedDistance);
                const clampedDist = Math.min(absDist, 2);

                // Scale: 0.8 -> 1.1 (center) -> 0.8
                // Using a bell curve-ish approximation
                let scale = 0.8;
                if (absDist < 1) {
                    // Linear interpolation from 0.8 to 1.1 as dist goes 1 -> 0
                    scale = 0.8 + (0.3 * (1 - absDist));
                } else {
                    // Stay at 0.8 or slightly lower
                    scale = 0.8 - (0.05 * (absDist - 1));
                }

                // Opacity: 0.1 -> 1.0 (center) -> 0.1
                let opacity = 0.1;
                if (absDist < 1) {
                    opacity = 0.3 + (0.7 * (1 - absDist));
                } else {
                    opacity = Math.max(0.1, 0.3 - (0.2 * (absDist - 1)));
                }

                // Blur: 12px -> 0px (center) -> 12px
                let blur = 12;
                if (absDist < 1) {
                    blur = 12 * absDist;
                } else {
                    blur = 12;
                }

                // RotateY: 45 -> 0 -> -45
                // Positive distance (right of center) should rotate negative (face left)?
                // LiquidTimeline: [45, 25, 0, -25, -45] for input [left, ..., center, ..., right]
                // So left of center (negative distance) = positive rotation
                const rotateY = normalizedDistance * -45;
                const clampedRotateY = Math.max(-45, Math.min(45, rotateY));

                // Parallax X: 100 -> 0 -> -100
                // Left of center (neg dist) -> positive X shift
                const x = normalizedDistance * -100;
                const clampedX = Math.max(-100, Math.min(100, x));

                // Depth Z: -300 -> 0 -> -300
                let z = -300;
                if (absDist < 1) {
                    z = -300 * absDist;
                }

                // Apply transforms
                card.style.transform = `
                    perspective(1500px)
                    translateX(${clampedX}px)
                    translateZ(${z}px)
                    rotateY(${clampedRotateY}deg)
                    scale(${scale})
                `;
                card.style.opacity = opacity;
                card.style.filter = `blur(${blur}px)`;

                // Z-Index: Center on top
                const zIndex = Math.round(50 - (absDist * 20));
                card.style.zIndex = zIndex;

                // Border Glow
                const borderGlow = card.querySelector('.card-border-glow');
                if (borderGlow) {
                    // Only show when very close to center
                    borderGlow.style.opacity = absDist < 0.2 ? 1 : 0;
                }

                // Update Active State (only when NOT keyboard navigating)
                if (!state.isNavigating) {
                    const isActive = absDist < 0.4;
                    if (isActive && state.currentIndex !== index) {
                        setActiveIndex(index);
                        state.targetIndex = index;
                    }
                }
            });
        }

        function setActiveIndex(index, options = {}) {
            if (!state.frames.length) return;

            const clamped = Math.max(0, Math.min(state.frames.length - 1, index));
            const shouldForce = options.force === true;
            if (!shouldForce && state.currentIndex === clamped) return;

            state.currentIndex = clamped;
            state.targetIndex = clamped;
            updateTimecode();
            updateMainPlayer(clamped);

            if (options.scroll === true) {
                const targetScroll = clamped * STRIDE;
                const maxScroll = viewport.scrollWidth - viewport.clientWidth;
                const clampedScroll = Math.max(0, Math.min(targetScroll, maxScroll));

                state.targetScroll = clampedScroll;
                state.isNavigating = !options.instant; // Lock during smooth scroll only

                viewport.scrollTo({
                    left: clampedScroll,
                    behavior: options.instant ? 'auto' : 'smooth'
                });
            }
        }

        function updateMainPlayer(index) {
            if (!state.frames[index]) return;
            const frame = state.frames[index];

            // Use dataset index for robust tracking (default to -1 if not set)
            const currentIndex = mainPlayerImg.dataset.index ? parseInt(mainPlayerImg.dataset.index) : -1;

            if (currentIndex !== index) {
                mainPlayerImg.style.opacity = '0.5';
                mainPlayerImg.src = frame.src;
                mainPlayerImg.dataset.index = index;

                mainPlayerImg.onload = () => {
                    mainPlayerImg.style.opacity = '1';
                };
            }
        }

        function handleScroll() {
            requestAnimationFrame(updateCardTransforms);
        }

        function scrollToIndex(index) {
            setActiveIndex(index, { scroll: true });
        }

        function handleKeyboard(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                e.preventDefault();

                // Use targetIndex to track intended position (avoids issues during smooth scroll)
                const currentTarget = state.targetIndex;
                let nextTarget;

                if (e.key === 'ArrowRight') {
                    nextTarget = Math.min(state.frames.length - 1, currentTarget + 1);
                } else {
                    nextTarget = Math.max(0, currentTarget - 1);
                }

                if (nextTarget === currentTarget) return;

                // Calculate clamped scroll position for completion check
                const targetScroll = nextTarget * STRIDE;
                const maxScroll = viewport.scrollWidth - viewport.clientWidth;
                const clampedScroll = Math.max(0, Math.min(targetScroll, maxScroll));

                // Set navigation lock - prevents scroll-based updates
                state.isNavigating = true;
                state.targetIndex = nextTarget;
                state.targetScroll = clampedScroll; // Store clamped scroll for completion check
                state.currentIndex = nextTarget;
                updateTimecode();
                updateMainPlayer(nextTarget);

                // Scroll to target
                viewport.scrollTo({
                    left: clampedScroll,
                    behavior: 'smooth'
                });
            } else if (e.key === 'Enter') {
                exportVideo();
            }
        }

        function updateTimecode() {
            if (!state.frames.length) {
                updateFrameBadge();
                return;
            }

            const frame = state.frames[state.currentIndex];
            if (!frame) {
                updateFrameBadge();
                return;
            }

            const timestamp = frame.timestamp || formatTimestamp(frame.seconds);
            // Ensure 00:00:00:00 format
            const parts = timestamp.split(':');
            let timecode = '00:00:00:00';
            if (parts.length >= 2) {
                timecode = `00:${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}:00`;
            }
            timecodeEl.textContent = timecode;

            // Update progress bar
            const progress = state.frames.length > 1 ? ((state.currentIndex + 1) / state.frames.length) : 0;
            progressFillEl.style.transform = `scaleX(${progress})`;

            updateFrameBadge();
        }

        function updateFrameBadge() {
            if (!frameBadgeEl) return;

            const total = state.frames.length;
            if (!total) {
                frameBadgeEl.textContent = 'Frame #-- / 0';
                return;
            }

            const current = Math.min(total, state.currentIndex + 1);
            frameBadgeEl.textContent = `Frame #${current} / ${total}`;
        }

        function formatTimestamp(seconds) {
            if (typeof seconds !== 'number') return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        async function exportVideo() {
            if (state.frames.length === 0) {
                alert('No frames to export');
                return;
            }

            const exportBtn = document.getElementById('confirm-selection-btn');
            const originalText = exportBtn.textContent;

            try {
                // Show loading state
                exportBtn.disabled = true;
                exportBtn.textContent = 'Exporting...';

                // Prepare frames data
                const framesData = state.frames.map(frame => ({
                    path: frame.path,
                    url: frame.src
                }));

                // Send request to backend
                const response = await fetch('/frames/export-video', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        frames: framesData,
                        frame_duration: 2.0,  // 2 seconds per frame
                        fps: 30
                    })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    // Update button text
                    exportBtn.textContent = 'Download Video';

                    // Download the video
                    const link = document.createElement('a');
                    link.href = result.video_url;
                    link.download = `exported_video_${Date.now()}.mp4`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // Reset button after a delay
                    setTimeout(() => {
                        exportBtn.textContent = originalText;
                        exportBtn.disabled = false;
                    }, 2000);
                } else {
                    alert(`Export failed: ${result.message}`);
                    exportBtn.textContent = originalText;
                    exportBtn.disabled = false;
                }
            } catch (error) {
                console.error('Export error:', error);
                alert(`Export failed: ${error.message}`);
                exportBtn.textContent = originalText;
                exportBtn.disabled = false;
            }
        }

        // --- New Control Functions ---

        function handleDeleteFrame() {
            if (state.frames.length === 0) return;

            const currentFrame = state.frames[state.currentIndex];
            const confirmed = confirm(`Delete Frame #${currentFrame.frame_number}?\n\nThis action cannot be undone.`);

            if (!confirmed) return;

            // Remove frame from state
            state.frames.splice(state.currentIndex, 1);

            // Re-number remaining frames
            state.frames.forEach((frame, index) => {
                frame.frame_number = index + 1;
            });

            // Update current index if needed
            if (state.currentIndex >= state.frames.length) {
                state.currentIndex = Math.max(0, state.frames.length - 1);
            }

            // Re-render timeline
            if (state.frames.length > 0) {
                renderTimeline();
                setActiveIndex(state.currentIndex, { force: true, scroll: true, instant: true });
                requestAnimationFrame(updateCardTransforms);
            } else {
                inner.innerHTML = '<div style="color: #666; text-align: center; padding: 100px;">No frames available</div>';
                mainPlayerImg.src = '';
                frameBadgeEl.textContent = 'Frame #-- / 0';
                timecodeEl.textContent = '00:00:00:00';
            }
        }

        function handleInsertFrame() {
            // Trigger file input dialog
            const fileInput = document.getElementById('frame-file-input');
            fileInput.click();
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validate file type
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file.');
                return;
            }

            // Create a local URL for the image
            const reader = new FileReader();

            reader.onerror = function() {
                alert('Failed to read the file. Please try again.');
            };

            reader.onload = function(e) {
                const imageUrl = e.target.result;

                // Calculate insertion point (after current frame, or 0 if no frames)
                const insertIndex = state.frames.length > 0 ? state.currentIndex + 1 : 0;

                // Calculate timestamp for new frame
                let newTimestamp = '0:00';
                let newSeconds = 0;

                if (state.frames.length > 0) {
                    const currentFrame = state.frames[state.currentIndex];
                    const nextFrame = state.frames[insertIndex];

                    if (nextFrame) {
                        // Insert between current and next - average the timestamps
                        newSeconds = (currentFrame.seconds + nextFrame.seconds) / 2;
                    } else {
                        // Insert at end - add 1 second to current
                        newSeconds = currentFrame.seconds + 1;
                    }
                    newTimestamp = formatTimestamp(newSeconds);
                }

                // Create new frame object
                const newFrame = {
                    id: `inserted_${Date.now()}`,
                    src: imageUrl,
                    timestamp: newTimestamp,
                    frame_number: insertIndex + 1,
                    seconds: newSeconds,
                    path: file.name,
                    isLocal: true // Flag to indicate this is a locally inserted frame
                };

                // Insert into frames array
                state.frames.splice(insertIndex, 0, newFrame);

                // Re-number frames after insertion point
                for (let i = insertIndex + 1; i < state.frames.length; i++) {
                    state.frames[i].frame_number = i + 1;
                }

                // Re-render timeline or initialize if first frame
                if (state.frames.length === 1) {
                    // First frame - need to fully initialize
                    inner.innerHTML = '';
                    renderTimeline();
                    const viewportWidth = window.innerWidth;
                    const sidePadding = (viewportWidth / 2) - (CARD_WIDTH / 2);
                    inner.style.paddingLeft = `${sidePadding}px`;
                    inner.style.paddingRight = `${sidePadding}px`;
                    viewport.scrollLeft = 0;
                } else {
                    renderTimeline();
                }

                // Navigate to newly inserted frame
                state.currentIndex = insertIndex;
                setActiveIndex(insertIndex, { force: true, scroll: true });
                requestAnimationFrame(updateCardTransforms);
            };

            reader.readAsDataURL(file);

            // Reset file input so same file can be selected again
            event.target.value = '';
        }

        async function handleDownloadFrame() {
            if (state.frames.length === 0) return;

            const currentFrame = state.frames[state.currentIndex];
            const filename = `frame_${currentFrame.frame_number}_${currentFrame.timestamp.replace(/:/g, '-')}.jpg`;

            try {
                // For local/blob URLs or same-origin images, use direct download
                if (currentFrame.src.startsWith('data:') || currentFrame.src.startsWith('blob:')) {
                    const link = document.createElement('a');
                    link.href = currentFrame.src;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    // For remote URLs, fetch and create blob to avoid CORS issues
                    const response = await fetch(currentFrame.src);
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);

                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // Clean up blob URL
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
                }
            } catch (error) {
                console.error('Download failed:', error);
                // Fallback to opening in new tab
                window.open(currentFrame.src, '_blank');
            }
        }

        // --- Edit Modal Functions ---

        function handleEditFramesOpen() {
            if (state.frames.length === 0) {
                alert('No frames available to edit');
                return;
            }

            const currentFrame = state.frames[state.currentIndex];
            const modal = document.getElementById('edit-modal');
            modal.classList.add('active');

            // Update modal title to show current frame number
            const modalTitle = modal.querySelector('.modal-header h2');
            const frameInfo = document.createElement('span');
            frameInfo.style.fontSize = '14px';
            frameInfo.style.color = 'rgba(255, 255, 255, 0.6)';
            frameInfo.style.fontWeight = '400';
            frameInfo.textContent = ` - Frame #${currentFrame.frame_number}`;

            // Remove old frame info if exists
            const oldFrameInfo = modalTitle.querySelector('span[style*="font-size: 14px"]');
            if (oldFrameInfo) {
                oldFrameInfo.remove();
            }
            modalTitle.appendChild(frameInfo);

            // Focus on the textarea for immediate input
            setTimeout(() => {
                document.getElementById('edit-prompt').focus();
            }, 100);
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('active');

            // Reset form
            document.getElementById('edit-prompt').value = '';
            document.getElementById('model-select').value = 'nanobanana-pro';
        }

        async function handleEditFramesSubmit() {
            const model = document.getElementById('model-select').value;
            const prompt = document.getElementById('edit-prompt').value.trim();

            if (!prompt) {
                alert('Please enter an edit prompt');
                return;
            }

            // Get current frame only
            const currentFrame = state.frames[state.currentIndex];
            if (!currentFrame) {
                alert('No frame selected');
                return;
            }

            const submitBtn = document.getElementById('modal-submit-btn');
            const submitBtnText = document.getElementById('submit-btn-text');
            const submitBtnSpinner = document.getElementById('submit-btn-spinner');

            try {
                // Show loading state
                submitBtn.disabled = true;
                submitBtnText.textContent = 'Processing...';
                submitBtnSpinner.style.display = 'inline-block';

                // Prepare current frame data only
                const framesData = [{
                    path: currentFrame.path,
                    url: currentFrame.src,
                    frame_number: currentFrame.frame_number
                }];

                // Send edit request to backend
                const response = await fetch('/frames/edit-with-ai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        frames: framesData,
                        model: model,
                        prompt: prompt
                    })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    // Update current frame with edited version
                    if (result.edited_frames && result.edited_frames.length > 0) {
                        const editedFrame = result.edited_frames[0];

                        // Update the current frame in state
                        state.frames[state.currentIndex].src = editedFrame.url;
                        if (editedFrame.path) {
                            state.frames[state.currentIndex].path = editedFrame.path;
                        }

                        // Re-render timeline with edited frame
                        renderTimeline();
                        setActiveIndex(state.currentIndex, { force: true, scroll: true });
                        requestAnimationFrame(updateCardTransforms);

                        // Close modal
                        closeEditModal();

                        // Show success message
                        alert(`Successfully edited frame #${currentFrame.frame_number}!`);
                    } else {
                        alert('No edited frame was returned. Please try again.');
                    }
                } else {
                    alert(`Edit failed: ${result.message || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Edit error:', error);
                alert(`Edit failed: ${error.message}`);
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitBtnText.textContent = 'Apply Edits';
                submitBtnSpinner.style.display = 'none';
            }
        }

        // Initialize on DOM ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
