<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Frame Selection - Cinema Timeline</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=SF+Mono&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Film Grain Overlay */
        .cinema-film-grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Background Ambient Glow */
        .cinema-ambient-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
            transition: opacity 1s ease;
        }

        .cinema-ambient-glow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.3) 0%, transparent 70%);
            filter: blur(150px);
            mix-blend-mode: screen;
        }

        /* Header HUD */
        .cinema-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 50;
            pointer-events: none;
            user-select: none;
        }

        .cinema-header>* {
            pointer-events: auto;
        }

        .cinema-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cinema-title h1 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: white;
        }

        .cinema-status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', monospace;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .cinema-status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }

        .cinema-header-controls {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .cinema-settings-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .cinema-settings-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .cinema-export-btn {
            padding: 12px 24px;
            border-radius: 9999px;
            background: white;
            color: black;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .cinema-export-btn:hover {
            transform: scale(1.05);
        }

        /* --- NLE Layout Styles --- */

        /* Main Player Stage */
        .nle-main-player {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: min(80vw, 1200px);
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 10;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nle-main-player img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 1;
            transition: opacity 0.1s ease;
        }

        .frame-position-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            letter-spacing: 0.05em;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        /* Timeline Strip Container */
        .nle-timeline-strip {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 320px;
            /* Increased height for controls */
            background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.9) 60%, transparent 100%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 40px;
            align-items: center;
        }

        /* Scrub Bar & Timecode */
        .nle-scrub-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            width: 100%;
            pointer-events: none;
        }

        .nle-timecode {
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.2em;
            font-variant-numeric: tabular-nums;
        }

        .nle-progress-track {
            width: 384px;
            /* w-96 */
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .nle-progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            background: white;
            width: 100%;
            transform-origin: left;
            transform: scaleX(0);
            /* Updated by JS */
        }

        /* Glass Controls Toolbar */
        .nle-glass-toolbar {
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.03);
            /* Very subtle bg */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            transform: scale(0.9);
            transition: background 0.3s ease;
            margin-bottom: 10px;
        }

        .nle-glass-toolbar:hover {
            background: rgba(10, 10, 10, 0.9);
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            position: relative;
            transition: color 0.2s ease;
        }

        .tool-btn:hover {
            color: white;
        }

        .tool-icon-box {
            padding: 8px;
            border-radius: 12px;
            transition: background 0.2s ease;
        }

        .tool-btn:hover .tool-icon-box {
            background: rgba(255, 255, 255, 0.1);
        }

        .tool-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
            position: absolute;
            bottom: -24px;
            opacity: 0;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        .tool-btn:hover .tool-label {
            opacity: 1;
        }

        .tool-separator {
            width: 1px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 8px;
        }

        .play-btn-large {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: white;
            color: black;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            margin: 0 8px;
        }

        .play-btn-large:hover {
            transform: scale(1.05);
        }

        .play-btn-large:active {
            transform: scale(0.95);
        }

        /* Cinema Timeline Viewport */
        .cinema-timeline-viewport {
            position: absolute;
            /* Positioned relative to strip */
            bottom: 140px;
            /* Above controls */
            left: 0;
            right: 0;
            height: 160px;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: grab;
            perspective: 1500px;
            /* Deep perspective */
            z-index: 10;
        }

        .cinema-timeline-viewport:active {
            cursor: grabbing;
        }

        .cinema-timeline-viewport::-webkit-scrollbar {
            display: none;
        }

        .cinema-timeline-inner {
            display: flex;
            gap: 60px;
            /* Matches GAP in LiquidTimeline */
            align-items: center;
            transform-style: preserve-3d;
            /* Padding set dynamically by JS */
        }

        /* Cinema Frame Cards */
        .cinema-frame-card {
            flex-shrink: 0;
            width: 240px;
            /* Compact width for NLE */
            aspect-ratio: 16 / 9;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            scroll-snap-align: center;
            background: #111827;
            /* gray-900 */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            /* shadow-2xl */
            will-change: transform, opacity, filter;
            /* No CSS transition for transform/opacity/filter as we use JS for physics */
        }

        /* Glass Reflection Layer */
        .card-reflection {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent, rgba(0, 0, 0, 0.4));
            z-index: 20;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .cinema-frame-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            pointer-events: none;
        }

        /* Metadata Overlay */
        .card-metadata {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.5), transparent);
            z-index: 30;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cinema-frame-card:hover .card-metadata {
            opacity: 1;
        }

        .card-metadata p {
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', monospace;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        /* Active Border Glow */
        .card-border-glow {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            z-index: 40;
            opacity: 0;
            /* Controlled by JS */
            pointer-events: none;
        }

        /* Center Focus Indicator */
        .center-focus-line {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1px;
            height: 80vh;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.1), transparent);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>

<body>
    <!-- Film Grain Overlay -->
    <div class="cinema-film-grain"></div>

    <!-- Background Ambient Glow -->
    <div class="cinema-ambient-glow"></div>

    <!-- Center Focus Indicator -->
    <div class="center-focus-line"></div>

    <!-- Header HUD -->
    <div class="cinema-header">
        <div class="cinema-title">
            <h1>Sequence 01</h1>
            <div class="cinema-status-bar">
                <div class="cinema-status-indicator"></div>
                <span>Ready</span>
                <span style="margin: 0 8px;">|</span>
                <span>4K HDR</span>
            </div>
        </div>

        <div class="cinema-header-controls">
            <button class="cinema-settings-btn" title="Settings">
                <span class="material-symbols-outlined" style="font-size: 20px;">settings</span>
            </button>
            <button class="cinema-export-btn" id="confirm-selection-btn">
                Export Video
            </button>
        </div>
    </div>

    <!-- Main Player -->
    <div class="nle-main-player">
        <div class="frame-position-badge" id="frame-position-badge">Frame #-- / 0</div>
        <img id="main-player-image" src="" alt="Active Frame">
    </div>

    <!-- Bottom Timeline Strip -->
    <div class="nle-timeline-strip">

        <!-- Timeline Viewport -->
        <div class="cinema-timeline-viewport" id="cinema-timeline-viewport">
            <div class="cinema-timeline-inner" id="cinema-timeline-inner">
                <!-- Cards injected here -->
            </div>
        </div>

        <!-- Scrub Bar / Timecode -->
        <div class="nle-scrub-section">
            <div class="nle-timecode" id="nle-timecode">00:00:00:00</div>
            <div class="nle-progress-track">
                <div class="nle-progress-fill" id="nle-progress-fill"></div>
            </div>
        </div>

        <!-- Glass Controls Toolbar -->
        <div class="nle-glass-toolbar">
            <!-- Hidden file input for image upload -->
            <input type="file" id="add-frame-input" accept="image/*" style="display: none;">

            <button class="tool-btn" id="add-frame-btn" title="Add a new frame">
                <div class="tool-icon-box">
                    <span class="material-symbols-outlined">add_photo_alternate</span>
                </div>
                <span class="tool-label">Add Frame</span>
            </button>
            <button class="tool-btn" id="save-order-btn" title="Save current frame order">
                <div class="tool-icon-box">
                    <span class="material-symbols-outlined">save</span>
                </div>
                <span class="tool-label">Save Order</span>
            </button>

            <div class="tool-separator"></div>

            <button class="play-btn-large">
                <span class="material-symbols-outlined" style="font-size: 28px;">play_arrow</span>
            </button>

            <div class="tool-separator"></div>

            <button class="tool-btn">
                <div class="tool-icon-box">
                    <span class="material-symbols-outlined">layers</span>
                </div>
                <span class="tool-label">Layers</span>
            </button>
            <button class="tool-btn">
                <div class="tool-icon-box">
                    <span class="material-symbols-outlined">monitor</span>
                </div>
                <span class="tool-label">Preview</span>
            </button>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            frames: [],
            currentIndex: 0,
            isNavigating: false,
            targetIndex: 0,
        };

        const CARD_WIDTH = 240;
        const GAP = 60;
        const STRIDE = CARD_WIDTH + GAP;

        // --- DOM Elements ---
        const viewport = document.getElementById('cinema-timeline-viewport');
        const inner = document.getElementById('cinema-timeline-inner');
        const timecodeEl = document.getElementById('nle-timecode');
        const progressFillEl = document.getElementById('nle-progress-fill');
        const mainPlayerImg = document.getElementById('main-player-image');
        const frameBadgeEl = document.getElementById('frame-position-badge');

        // --- Initialize ---
        function init() {
            // Data passed from server via Jinja2
            const serverFrames = {{ frames | tojson | safe
        }};

        if (serverFrames && serverFrames.length > 0) {
            state.frames = serverFrames.map((f, i) => ({
                id: f.frame_id,
                src: f.url,
                timestamp: f.timestamp,
                frame_number: i + 1,
                seconds: f.seconds,
                path: f.path
            }));
        } else {
            console.warn("No frames provided from server");
            state.frames = [];
        }

        if (state.frames.length > 0) {
            renderTimeline();
            setActiveIndex(0, { force: true, instant: true });

            // Set inner padding to center first/last cards
            const viewportWidth = window.innerWidth;
            const sidePadding = (viewportWidth / 2) - (CARD_WIDTH / 2);
            inner.style.paddingLeft = `${sidePadding}px`;
            inner.style.paddingRight = `${sidePadding}px`;

            // Set initial scroll position to 0 to center the first frame
            viewport.scrollLeft = 0;

            // Initial Transform Update
            requestAnimationFrame(updateCardTransforms);
        } else {
            inner.innerHTML = '<div style="color: #666; text-align: center; padding: 100px;">No frames available</div>';
        }

        // Event Listeners
        viewport.addEventListener('scroll', handleScroll);
        document.addEventListener('keydown', handleKeyboard);
        document.getElementById('confirm-selection-btn').addEventListener('click', confirmSelection);
        }

        function renderTimeline() {
            inner.innerHTML = state.frames.map((frame, index) => `
                <div class="cinema-frame-card"
                     data-index="${index}"
                     onclick="scrollToIndex(${index})">
                    <div class="card-reflection"></div>
                    <img src="${frame.src}" alt="Frame ${frame.frame_number}" draggable="false">
                    <div class="card-metadata">
                        <p>
                            <span>Clip ${frame.frame_number}</span>
                            <span style="opacity: 0.5;">RAW</span>
                        </p>
                    </div>
                    <div class="card-border-glow"></div>
                </div>
            `).join('');
        }

        function updateCardTransforms() {
            const scrollX = viewport.scrollLeft;
            const viewportWidth = viewport.clientWidth;
            const centerX = scrollX + (viewportWidth / 2);

            // Check if keyboard navigation scroll has completed
            if (state.isNavigating) {
                const targetScroll = state.targetIndex * STRIDE;
                const scrollDiff = Math.abs(scrollX - targetScroll);
                // Unlock when scroll is close enough to target (within 5px)
                if (scrollDiff < 5) {
                    state.isNavigating = false;
                }
            }

            const cards = inner.querySelectorAll('.cinema-frame-card');

            cards.forEach((card, index) => {
                const cardCenter = card.offsetLeft + (CARD_WIDTH / 2);
                const distance = cardCenter - centerX;
                const normalizedDistance = distance / STRIDE;

                // --- Physics Logic (Ported from LiquidTimeline.tsx) ---

                // Input Range logic simulation
                // We want effects to happen within +/- 2 strides

                const absDist = Math.abs(normalizedDistance);
                const clampedDist = Math.min(absDist, 2);

                // Scale: 0.8 -> 1.1 (center) -> 0.8
                // Using a bell curve-ish approximation
                let scale = 0.8;
                if (absDist < 1) {
                    // Linear interpolation from 0.8 to 1.1 as dist goes 1 -> 0
                    scale = 0.8 + (0.3 * (1 - absDist));
                } else {
                    // Stay at 0.8 or slightly lower
                    scale = 0.8 - (0.05 * (absDist - 1));
                }

                // Opacity: 0.1 -> 1.0 (center) -> 0.1
                let opacity = 0.1;
                if (absDist < 1) {
                    opacity = 0.3 + (0.7 * (1 - absDist));
                } else {
                    opacity = Math.max(0.1, 0.3 - (0.2 * (absDist - 1)));
                }

                // Blur: 12px -> 0px (center) -> 12px
                let blur = 12;
                if (absDist < 1) {
                    blur = 12 * absDist;
                } else {
                    blur = 12;
                }

                // RotateY: 45 -> 0 -> -45
                // Positive distance (right of center) should rotate negative (face left)?
                // LiquidTimeline: [45, 25, 0, -25, -45] for input [left, ..., center, ..., right]
                // So left of center (negative distance) = positive rotation
                const rotateY = normalizedDistance * -45;
                const clampedRotateY = Math.max(-45, Math.min(45, rotateY));

                // Parallax X: 100 -> 0 -> -100
                // Left of center (neg dist) -> positive X shift
                const x = normalizedDistance * -100;
                const clampedX = Math.max(-100, Math.min(100, x));

                // Depth Z: -300 -> 0 -> -300
                let z = -300;
                if (absDist < 1) {
                    z = -300 * absDist;
                }

                // Apply transforms
                card.style.transform = `
                    perspective(1500px)
                    translateX(${clampedX}px)
                    translateZ(${z}px)
                    rotateY(${clampedRotateY}deg)
                    scale(${scale})
                `;
                card.style.opacity = opacity;
                card.style.filter = `blur(${blur}px)`;

                // Z-Index: Center on top
                const zIndex = Math.round(50 - (absDist * 20));
                card.style.zIndex = zIndex;

                // Border Glow
                const borderGlow = card.querySelector('.card-border-glow');
                if (borderGlow) {
                    // Only show when very close to center
                    borderGlow.style.opacity = absDist < 0.2 ? 1 : 0;
                }

                // Update Active State (only when NOT keyboard navigating)
                if (!state.isNavigating) {
                    const isActive = absDist < 0.4;
                    if (isActive && state.currentIndex !== index) {
                        setActiveIndex(index);
                        state.targetIndex = index;
                    }
                }
            });
        }

        function setActiveIndex(index, options = {}) {
            if (!state.frames.length) return;

            const clamped = Math.max(0, Math.min(state.frames.length - 1, index));
            const shouldForce = options.force === true;
            if (!shouldForce && state.currentIndex === clamped) return;

            state.currentIndex = clamped;
            updateTimecode();
            updateMainPlayer(clamped);

            if (options.scroll === true) {
                const targetScroll = clamped * STRIDE;
                viewport.scrollTo({
                    left: targetScroll,
                    behavior: options.instant ? 'auto' : 'smooth'
                });
            }
        }

        function updateMainPlayer(index) {
            if (!state.frames[index]) return;
            const frame = state.frames[index];

            // Debounce/Check if actually changed to avoid flickering
            if (mainPlayerImg.getAttribute('src') !== frame.src) {
                mainPlayerImg.style.opacity = '0.5';
                setTimeout(() => {
                    mainPlayerImg.src = frame.src;
                    mainPlayerImg.onload = () => {
                        mainPlayerImg.style.opacity = '1';
                    };
                }, 50);
            }
        }

        function handleScroll() {
            requestAnimationFrame(updateCardTransforms);
        }

        function scrollToIndex(index) {
            setActiveIndex(index, { scroll: true });
        }

        function handleKeyboard(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                e.preventDefault();

                // Use targetIndex to track intended position (avoids issues during smooth scroll)
                const currentTarget = state.targetIndex;
                let nextTarget;

                if (e.key === 'ArrowRight') {
                    nextTarget = Math.min(state.frames.length - 1, currentTarget + 1);
                } else {
                    nextTarget = Math.max(0, currentTarget - 1);
                }

                if (nextTarget === currentTarget) return;

                // Set navigation lock - prevents scroll-based updates
                state.isNavigating = true;
                state.targetIndex = nextTarget;
                state.currentIndex = nextTarget;
                updateTimecode();
                updateMainPlayer(nextTarget);

                // Scroll to target
                const targetScroll = nextTarget * STRIDE;
                viewport.scrollTo({
                    left: targetScroll,
                    behavior: 'smooth'
                });
            } else if (e.key === 'Enter') {
                confirmSelection();
            }
        }

        function updateTimecode() {
            if (!state.frames.length) {
                updateFrameBadge();
                return;
            }

            const frame = state.frames[state.currentIndex];
            if (!frame) {
                updateFrameBadge();
                return;
            }

            const timestamp = frame.timestamp || formatTimestamp(frame.seconds);
            // Ensure 00:00:00:00 format
            const parts = timestamp.split(':');
            let timecode = '00:00:00:00';
            if (parts.length >= 2) {
                timecode = `00:${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}:00`;
            }
            timecodeEl.textContent = timecode;

            // Update progress bar
            const progress = state.frames.length > 1 ? ((state.currentIndex + 1) / state.frames.length) : 0;
            progressFillEl.style.transform = `scaleX(${progress})`;

            updateFrameBadge();
        }

        function updateFrameBadge() {
            if (!frameBadgeEl) return;

            const total = state.frames.length;
            if (!total) {
                frameBadgeEl.textContent = 'Frame #-- / 0';
                return;
            }

            const current = Math.min(total, state.currentIndex + 1);
            frameBadgeEl.textContent = `Frame #${current} / ${total}`;
        }

        function formatTimestamp(seconds) {
            if (typeof seconds !== 'number') return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function confirmSelection() {
            // Trigger video export
            exportVideo();
        }

        async function exportVideo() {
            if (state.frames.length === 0) {
                alert('No frames to export');
                return;
            }

            const exportBtn = document.getElementById('confirm-selection-btn');
            const originalText = exportBtn.textContent;
            exportBtn.textContent = 'Exporting...';
            exportBtn.disabled = true;

            // Show loading overlay
            const overlay = document.createElement('div');
            overlay.className = 'export-overlay';
            overlay.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;';
            overlay.innerHTML = `
                <span class="material-symbols-outlined" style="font-size: 48px; color: white; animation: spin 1s linear infinite;">progress_activity</span>
                <div style="color: white; margin-top: 16px; font-size: 18px;">Exporting ${state.frames.length} frames to video...</div>
                <div style="color: #888; margin-top: 8px; font-size: 14px;">This may take a moment</div>
            `;
            document.body.appendChild(overlay);

            // Add spin animation
            const style = document.createElement('style');
            style.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
            document.head.appendChild(style);

            try {
                const response = await fetch('/frames/export_video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fps: 24,
                        duration_per_frame: 0.5
                    })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    overlay.innerHTML = `
                        <span class="material-symbols-outlined" style="font-size: 48px; color: #10b981;">check_circle</span>
                        <div style="color: white; margin-top: 16px; font-size: 18px;">Export Complete!</div>
                        <div style="color: #888; margin-top: 8px; font-size: 14px;">${data.frame_count} frames • ${data.duration.toFixed(1)}s duration</div>
                        <a href="${data.download_url}" download="${data.filename}" 
                           style="margin-top: 24px; padding: 12px 32px; background: white; color: black; text-decoration: none; border-radius: 9999px; font-weight: 600;">
                            Download Video
                        </a>
                        <button onclick="this.parentElement.remove()" 
                                style="margin-top: 16px; background: none; border: 1px solid #666; color: #888; padding: 8px 24px; border-radius: 9999px; cursor: pointer;">
                            Close
                        </button>
                    `;

                    // Auto-start download
                    const link = document.createElement('a');
                    link.href = data.download_url;
                    link.download = data.filename;
                    link.click();
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                overlay.remove();
                alert('Export failed: ' + err.message);
            } finally {
                exportBtn.textContent = originalText;
                exportBtn.disabled = false;
            }
        }

        // --- Upload Frame Handler ---
        function setupUploadHandler() {
            const addBtn = document.getElementById('add-frame-btn');
            const addInput = document.getElementById('add-frame-input');
            const saveBtn = document.getElementById('save-order-btn');

            if (addBtn && addInput) {
                addBtn.addEventListener('click', () => addInput.click());
                addInput.addEventListener('change', handleFrameUpload);
            }

            if (saveBtn) {
                saveBtn.addEventListener('click', saveFrameOrder);
            }
        }

        async function handleFrameUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            e.target.value = '';  // Reset for next upload

            // Show loading
            const loadingDiv = document.createElement('div');
            loadingDiv.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000;';
            loadingDiv.innerHTML = '<span class="material-symbols-outlined" style="font-size: 48px; color: white; animation: spin 1s linear infinite;">progress_activity</span>';
            document.body.appendChild(loadingDiv);

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('position', state.currentIndex + 1);  // Insert after current

                const response = await fetch('/frames/upload_image', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.status === 'success') {
                    window.location.reload();
                } else {
                    alert('Upload failed: ' + data.message);
                }
            } catch (err) {
                alert('Error uploading: ' + err.message);
            } finally {
                loadingDiv.remove();
            }
        }

        async function saveFrameOrder() {
            const filenames = state.frames.map(f => {
                if (f.path) {
                    return f.path.split('/').pop();
                }
                return f.src.split('/').pop();
            });

            try {
                const response = await fetch('/frames/save_order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filenames })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    const toast = document.createElement('div');
                    toast.textContent = 'Order saved!';
                    toast.style.cssText = 'position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 12px 24px; border-radius: 8px; z-index: 1000;';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2000);
                } else {
                    alert('Failed to save: ' + data.message);
                }
            } catch (err) {
                alert('Error saving order: ' + err.message);
            }
        }

        // Initialize on DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            init();
            setupUploadHandler();
        });
    </script>
</body>

</html>
