<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Frame Selection - Cinema Timeline</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=SF+Mono&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Film Grain Overlay */
        .cinema-film-grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Background Ambient Glow */
        .cinema-ambient-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
        }

        .cinema-ambient-glow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
            filter: blur(100px);
        }

        /* Header HUD */
        .cinema-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 50;
            pointer-events: none;
        }

        .cinema-header>* {
            pointer-events: auto;
        }

        .cinema-title h1 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .cinema-status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', monospace;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .cinema-status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }

        .cinema-header-controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .cinema-settings-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .cinema-settings-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .cinema-export-btn {
            padding: 12px 24px;
            border-radius: 9999px;
            background: white;
            color: black;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .cinema-export-btn:hover {
            transform: scale(1.05);
        }

        /* Center Focus Indicator */
        .cinema-center-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1px;
            height: 80vh;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.1), transparent);
            pointer-events: none;
            z-index: 5;
        }

        /* Cinema Timeline Viewport */
        .cinema-timeline-viewport {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: grab;
            perspective: 1500px;
            z-index: 10;
        }

        .cinema-timeline-viewport:active {
            cursor: grabbing;
        }

        .cinema-timeline-viewport::-webkit-scrollbar {
            display: none;
        }

        .cinema-timeline-inner {
            display: flex;
            gap: 60px;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* Cinema Frame Cards */
        .cinema-frame-card {
            flex-shrink: 0;
            width: 600px;
            aspect-ratio: 16 / 9;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            scroll-snap-align: center;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                filter 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform, opacity, filter;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: #1a1a1a;
        }

        .cinema-frame-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            pointer-events: none;
        }

        /* Glass Reflection Layer */
        .cinema-frame-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.15) 0%,
                    transparent 50%,
                    rgba(0, 0, 0, 0.3) 100%);
            z-index: 20;
            pointer-events: none;
            mix-blend-mode: overlay;
            border-radius: 16px;
        }

        /* Frame metadata overlay */
        .cinema-frame-metadata {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.5), transparent);
            z-index: 30;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cinema-frame-card:hover .cinema-frame-metadata {
            opacity: 1;
        }

        .cinema-frame-metadata p {
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', monospace;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .cinema-frame-metadata .raw-badge {
            opacity: 0.5;
        }

        /* Active frame border glow */
        .cinema-frame-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            z-index: 40;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .cinema-frame-card.active::after {
            opacity: 1;
        }

        /* Bottom Glass Toolbar Container */
        .cinema-toolbar-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            pointer-events: none;
        }

        .cinema-toolbar-container>* {
            pointer-events: auto;
        }

        /* Scrub Bar */
        .cinema-scrub-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .cinema-timecode {
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.2em;
            font-variant-numeric: tabular-nums;
        }

        .cinema-scrub-bar {
            width: 384px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .cinema-scrub-progress {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            background: white;
            border-radius: 9999px;
            transition: width 0.3s ease;
        }

        /* Glass Toolbar */
        .cinema-glass-toolbar {
            display: flex;
            align-items: center;
            gap: 32px;
            padding: 16px 40px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            transition: background 0.3s ease;
        }

        .cinema-glass-toolbar:hover {
            background: rgba(10, 10, 10, 0.9);
        }

        .cinema-tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: color 0.2s ease;
            position: relative;
        }

        .cinema-tool-btn:hover {
            color: white;
        }

        .cinema-tool-btn .icon-container {
            padding: 8px;
            border-radius: 12px;
            transition: background 0.2s ease;
        }

        .cinema-tool-btn:hover .icon-container {
            background: rgba(255, 255, 255, 0.1);
        }

        .cinema-tool-btn .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
            opacity: 0;
            position: absolute;
            bottom: -20px;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }

        .cinema-tool-btn:hover .label {
            opacity: 1;
        }

        .cinema-toolbar-divider {
            width: 1px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 8px;
        }

        .cinema-play-btn {
            width: 64px;
            height: 64px;
            background: white;
            color: black;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            margin: 0 8px;
        }

        .cinema-play-btn:hover {
            transform: scale(1.05);
        }

        .cinema-play-btn:active {
            transform: scale(0.95);
        }

        .cinema-play-btn .material-symbols-outlined {
            font-size: 28px;
            margin-left: 4px;
        }

        /* Navigation Hints */
        .keyboard-hint {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            z-index: 40;
        }

        .keyboard-hint kbd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            padding: 0 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <!-- Film Grain Overlay -->
    <div class="cinema-film-grain"></div>

    <!-- Background Ambient Glow -->
    <div class="cinema-ambient-glow"></div>

    <!-- Center Focus Indicator -->
    <div class="cinema-center-indicator"></div>

    <!-- Header HUD -->
    <div class="cinema-header">
        <div class="cinema-title">
            <h1>Sequence 01</h1>
            <div class="cinema-status-bar">
                <div class="cinema-status-indicator"></div>
                <span>Ready</span>
                <span style="margin: 0 8px;">|</span>
                <span id="frame-counter">0 frames</span>
            </div>
        </div>
        <div class="cinema-header-controls">
            <button class="cinema-settings-btn" title="Settings">
                <span class="material-symbols-outlined" style="font-size: 20px;">settings</span>
            </button>
            <button class="cinema-export-btn" id="confirm-selection-btn">Confirm Selection</button>
        </div>
    </div>

    <!-- Cinema Timeline Viewport -->
    <div class="cinema-timeline-viewport" id="cinema-timeline-viewport">
        <div class="cinema-timeline-inner" id="cinema-timeline-inner">
            <!-- Cinema frame cards will be inserted here by JS -->
        </div>
    </div>

    <!-- Bottom Glass Toolbar -->
    <div class="cinema-toolbar-container">
        <!-- Scrub Bar / Timecode -->
        <div class="cinema-scrub-container">
            <div class="cinema-timecode" id="cinema-timecode">00:00:00:00</div>
            <div class="cinema-scrub-bar">
                <div class="cinema-scrub-progress" id="cinema-scrub-progress" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Glass Toolbar -->
        <div class="cinema-glass-toolbar">
            <button class="cinema-tool-btn" title="Split">
                <div class="icon-container">
                    <span class="material-symbols-outlined" style="font-size: 20px;">content_cut</span>
                </div>
                <span class="label">Split</span>
            </button>
            <button class="cinema-tool-btn" title="Audio">
                <div class="icon-container">
                    <span class="material-symbols-outlined" style="font-size: 20px;">volume_up</span>
                </div>
                <span class="label">Audio</span>
            </button>

            <div class="cinema-toolbar-divider"></div>

            <button class="cinema-play-btn" title="Play/Pause">
                <span class="material-symbols-outlined">play_arrow</span>
            </button>

            <div class="cinema-toolbar-divider"></div>

            <button class="cinema-tool-btn" title="Layers">
                <div class="icon-container">
                    <span class="material-symbols-outlined" style="font-size: 20px;">layers</span>
                </div>
                <span class="label">Layers</span>
            </button>
            <button class="cinema-tool-btn" title="Preview">
                <div class="icon-container">
                    <span class="material-symbols-outlined" style="font-size: 20px;">desktop_windows</span>
                </div>
                <span class="label">Preview</span>
            </button>
        </div>
    </div>

    <!-- Keyboard Hints -->
    <div class="keyboard-hint">
        <kbd>←</kbd><kbd>→</kbd> Navigate
        <span style="margin: 0 8px;">|</span>
        <kbd>Enter</kbd> Select
    </div>

    <script>
        // --- State Management ---
        const state = {
            frames: [],
            currentIndex: 0,
        };

        const CARD_WIDTH = 600;
        const CARD_GAP = 60;

        // --- DOM Elements ---
        const viewport = document.getElementById('cinema-timeline-viewport');
        const inner = document.getElementById('cinema-timeline-inner');
        const timecodeEl = document.getElementById('cinema-timecode');
        const progressEl = document.getElementById('cinema-scrub-progress');
        const frameCounterEl = document.getElementById('frame-counter');

        // --- Initialize ---
        function init() {
            // Data passed from server via Jinja2
            const serverFrames = {{ frames | tojson | safe
        }};

        if (serverFrames && serverFrames.length > 0) {
            state.frames = serverFrames.map((f, i) => ({
                id: f.frame_id,
                src: f.url,
                timestamp: f.timestamp,
                frame_number: i + 1,
                seconds: f.seconds,
                path: f.path
            }));
        } else {
            console.warn("No frames provided from server");
            state.frames = [];
        }

        if (state.frames.length > 0) {
            renderTimeline();
            updateFrameCounter();
            updateTimecode();
            updateCardTransforms();

            // Set viewport padding to center first/last cards
            const viewportWidth = window.innerWidth;
            const sidePadding = (viewportWidth / 2) - (CARD_WIDTH / 2);
            viewport.style.paddingLeft = `${sidePadding}px`;
            viewport.style.paddingRight = `${sidePadding}px`;
        } else {
            inner.innerHTML = '<div style="color: #666; text-align: center; padding: 100px;">No frames available</div>';
        }

        // Event Listeners
        viewport.addEventListener('scroll', handleScroll);
        document.addEventListener('keydown', handleKeyboard);

        // Confirm button
        document.getElementById('confirm-selection-btn').addEventListener('click', confirmSelection);
        }

        function renderTimeline() {
            inner.innerHTML = state.frames.map((frame, index) => `
                <div class="cinema-frame-card ${index === 0 ? 'active' : ''}"
                     data-index="${index}"
                     onclick="scrollToIndex(${index})">
                    <img src="${frame.src}" alt="Frame ${frame.frame_number}" draggable="false">
                    <div class="cinema-frame-metadata">
                        <p>
                            <span>Clip ${frame.frame_number}</span>
                            <span class="raw-badge">RAW</span>
                        </p>
                    </div>
                </div>
            `).join('');
        }

        function updateCardTransforms() {
            const scrollX = viewport.scrollLeft;
            const viewportWidth = viewport.clientWidth;
            const centerX = scrollX + (viewportWidth / 2);

            const cards = inner.querySelectorAll('.cinema-frame-card');

            cards.forEach((card, index) => {
                const cardCenter = card.offsetLeft + (CARD_WIDTH / 2);
                const distance = cardCenter - centerX;
                const normalizedDistance = distance / (CARD_WIDTH + CARD_GAP);

                // Calculate 3D transforms based on distance
                const absDistance = Math.abs(normalizedDistance);
                const clampedDistance = Math.min(absDistance, 2);

                // Scale: 1.1 at center, 0.8 at edges
                const scale = 1.1 - (clampedDistance * 0.15);

                // RotateY: 0 at center, ±45deg at edges
                const rotateY = normalizedDistance * 25;

                // X translation for parallax effect
                const translateX = normalizedDistance * -40;

                // Z translation for depth
                const translateZ = -Math.abs(normalizedDistance) * 150;

                // Opacity: 1 at center, 0.1 at edges
                const opacity = Math.max(0.1, 1 - (clampedDistance * 0.45));

                // Blur: 0 at center, 12px at edges
                const blur = clampedDistance * 6;

                // Apply transforms
                card.style.transform = `
                    perspective(1500px)
                    translateX(${translateX}px)
                    translateZ(${translateZ}px)
                    rotateY(${rotateY}deg)
                    scale(${scale})
                `;
                card.style.opacity = opacity;
                card.style.filter = `blur(${blur}px)`;
                card.style.zIndex = Math.round(50 - absDistance * 20);

                // Toggle active class
                const isActive = absDistance < 0.3;
                card.classList.toggle('active', isActive);

                if (isActive && state.currentIndex !== index) {
                    state.currentIndex = index;
                    updateTimecode();
                }
            });
        }

        function handleScroll() {
            requestAnimationFrame(updateCardTransforms);
        }

        function scrollToIndex(index) {
            const targetScroll = index * (CARD_WIDTH + CARD_GAP);
            viewport.scrollTo({
                left: targetScroll,
                behavior: 'smooth'
            });
        }

        function handleKeyboard(e) {
            if (e.key === 'ArrowRight') {
                const nextIndex = Math.min(state.frames.length - 1, state.currentIndex + 1);
                scrollToIndex(nextIndex);
            } else if (e.key === 'ArrowLeft') {
                const prevIndex = Math.max(0, state.currentIndex - 1);
                scrollToIndex(prevIndex);
            } else if (e.key === 'Enter') {
                confirmSelection();
            }
        }

        function updateFrameCounter() {
            frameCounterEl.textContent = `${state.frames.length} frames`;
        }

        function updateTimecode() {
            const frame = state.frames[state.currentIndex];
            if (!frame) return;

            const timestamp = frame.timestamp || formatTimestamp(frame.seconds);
            const parts = timestamp.split(':');
            let timecode = '00:00:00:00';
            if (parts.length >= 2) {
                timecode = `00:${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}:00`;
            }

            timecodeEl.textContent = timecode;

            // Update progress bar
            const progress = state.frames.length > 1 ? ((state.currentIndex + 1) / state.frames.length) * 100 : 0;
            progressEl.style.width = `${progress}%`;
        }

        function formatTimestamp(seconds) {
            if (typeof seconds !== 'number') return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function confirmSelection() {
            if (state.frames.length === 0) return;

            const selected = state.frames[state.currentIndex];
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'FRAME_SELECTED',
                    frame: selected
                }, '*');
                window.close();
            } else {
                alert(`Selected Frame ${selected.frame_number} at ${selected.timestamp}\n(Parent window not found, cannot return selection)`);
            }
        }

        // Initialize on DOM ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
