[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore patterns
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    venv
    __pycache__
    mcp_server

# Markers for optional dependencies
markers =
    requires_google_genai: tests requiring google-genai package
    requires_google_api_core: tests requiring google-api-core package
    requires_mcp: tests requiring MCP packages

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Coverage (if pytest-cov is installed)
# addopts = -v --cov=. --cov-report=term-missing
